<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>隐私与数据使用说明 - Kerrey ACC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container privacy-page">
    <header class="app-header">
      <p class="eyebrow">KERREY 官方工具</p>
      <h1>隐私与数据使用说明</h1>
    </header>

    <p>Kerrey ACC 竞品截图工具仅用于接收关键词任务并发送处理结果。</p>
    <h2>我们会使用哪些信息</h2>
    <p>提交任务时会发送你主动填写的关键词、接收邮箱和任务授权令牌。邮箱只用于发送本次任务结果；浏览器中仅在当前会话临时保留邮箱内容。</p>
    <h2>我们不会要求什么</h2>
    <p>本页面不会要求 Google、Amazon、银行卡或其他账号密码，不会读取浏览器密码、Cookie，也不会自动下载或安装软件。</p>
    <h2>数据传输</h2>
    <p>任务通过本站的安全接口转发至任务服务处理。除完成任务所必需的服务外，不向广告或第三方追踪服务提供数据。</p>
    <p><a href="index.html">返回任务提交页面</a></p>
  </main>
</body>
</html>
